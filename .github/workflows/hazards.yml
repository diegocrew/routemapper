name: Refresh live conditions

# Natural hazards and border waits, which go stale within hours. Armed conflict
# runs separately in conflict.yml on a daily schedule: it moves monthly, and the
# two must not share a file since each rewrites its zones wholesale.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:hazards
        env:
          FIRMS_API_KEY: ${{ secrets.NASA }}
      # Sanctions and conflict move slowly and both sources fail soft, so a bad
      # day here leaves the previous file in place rather than failing the run.
      - run: npm run fetch:country-risk
        continue-on-error: true
      # Border conditions are advisory: nothing here can close a corridor, so a
      # failed fetch costs a warning label, not a routing decision.
      - run: npm run fetch:border-status
        continue-on-error: true
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
      - run: npm run validate:data
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hazardZones.json src/data/hazardEdgeZones.json src/data/hazardHistory.json src/data/countryRisk.json src/data/borderStatus.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh hazard zones"
            git push
          else
            echo "No hazard changes this run."
          fi
